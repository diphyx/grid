name: docker

# Both images, from the one Dockerfile: on main as `:main`, once test.yml passes; for a release,
# release.yml calls this after the release, already tested, for `:1.2.3`, `:1.2` and `:latest`
# (not for a pre-release like v1.2.3-rc.1).
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tested:
        description: "The caller already ran test.yml"
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: ${{ !inputs.tested }}
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    name: image (${{ matrix.target }})
    runs-on: ubuntu-latest
    concurrency:
      group: docker-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [hub, node]
    steps:
      - uses: actions/checkout@v5

      # Go cross-compiles at native speed; QEMU only runs the arm64 alpine stage (apk, adduser).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grid-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
