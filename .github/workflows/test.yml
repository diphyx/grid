name: test

# Vet and every test; release.yml runs it first, and docker.yml when run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The Windows build differs only in pkg/node/group_windows.go; vet it too.
      - name: Vet for Windows
        env:
          GOOS: windows
        run: go vet ./...

      - name: Test
        run: go test -race ./...
