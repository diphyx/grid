name: test

# Vet and every test; release.yml runs it first, and docker.yml when run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The Windows build differs only in pkg/node/group_windows.go and link_windows.go; vet it too.
      - name: Vet for Windows
        env:
          GOOS: windows
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # On Windows, the tests that need no shell: the kit cmds are sh scripts. TestLink checks the
  # junction a share is linked by.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go test ./pkg/wire ./pkg/history
          go test ./pkg/node -run "TestLink|TestShareLimit"
          go test ./pkg/hub -run TestShareRules
